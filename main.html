<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan - Stephen & Dessy</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600&family=Poppins:ital,wght@0,400;0,500;0,600;0,700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <div class="main-wrapper d-flex align-items-center justify-content-center">
        
        <!-- CARD CANVAS (RASIO CANVA PRESISI 9:16) -->
        <div class="card-canvas shadow-lg">
            
            <div class="content-container text-center">
                
                <!-- 1. HEADER TITLE (ATAS FOTO) -->
                <div class="top-content">
                    <p class="text-subtitle mb-0">The Wedding Of :</p>
                    <h1 class="couple-name mb-0">Stephen & Dessy</h1>
                </div>

                <!-- 2. FOTO PREWEDDING (MEPET PINGGIR TANPA PADDING) -->
                <div class="photo-bleed-wrapper">
                    <img src="foto pernikahan/fotoslideshow1.jpeg" alt="Stephen & Dessy" class="photo-main">
                </div>

                <!-- 3. COUNTDOWN TIMER SECTION -->
                <div class="countdown-section">
                    <p class="countdown-title mb-2">COUNTDOWN TIMER</p>
                    
                    <div class="countdown-display d-flex justify-content-center align-items-center gap-2 mb-3">
                        <!-- DAYS -->
                        <div class="time-unit">
                            <div class="flip-card">
                                <span id="days">003</span>
                                <div class="flip-line"></div>
                            </div>
                            <small class="unit-label">DAYS</small>
                        </div>

                        <span class="colon">:</span>

                        <!-- HOURS -->
                        <div class="time-unit">
                            <div class="flip-card">
                                <span id="hours">22</span>
                                <div class="flip-line"></div>
                            </div>
                            <small class="unit-label">HRS</small>
                        </div>

                        <span class="colon">:</span>

                        <!-- MINUTES -->
                        <div class="time-unit">
                            <div class="flip-card">
                                <span id="minutes">29</span>
                                <div class="flip-line"></div>
                            </div>
                            <small class="unit-label">MINS</small>
                        </div>

                        <span class="colon">:</span>

                        <!-- SECONDS -->
                        <div class="time-unit">
                            <div class="flip-card">
                                <span id="seconds">57</span>
                                <div class="flip-line"></div>
                            </div>
                            <small class="unit-label">SECS</small>
                        </div>
                    </div>

                    <!-- TOMBOL SAVE THE DATE -->
                    <div class="button-wrapper">
                    <a href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Pernikahan+Stephen+%26+Dessy&dates=20261017T010000Z/20261017T050000Z&details=Acara+Pernikahan+Stephen+%26+Dessy.+Mohon+doa+restu.&location=Gedung+Grand+Ballroom,+Jakarta" 
                        target="_blank" rel="noopener noreferrer" class="btn btn-canva-brown rounded-pill">
                            Save The Date !
                        </a>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <!-- Custom JS -->
    <script src="js/main.js"></script>
</body>
</html>
