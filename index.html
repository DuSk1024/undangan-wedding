<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan - Stephen & Dessy</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts Import -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@600&family=Italianno&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/index.css">

    <!-- GSAP Animation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

    <div id="pageWrapper" class="cover-wrapper d-flex align-items-center justify-content-center">
        
        <!-- PANGGUNG KARTU CANVA (MEMANJANG KE BAWAH RASIO 9:16) -->
        <div class="card-canvas shadow-lg">
            
            <!-- BACKGROUND FOTO PREWEDDING UTAMA -->
            <img src="foto pernikahan/foto index.jpeg" class="photo-bg" id="photoBg" alt="Stephen & Dessy">
            
            <!-- OVERLAY FADE VIGNETTE SOFT HALUS -->
            <div class="photo-overlay"></div>

            <!-- CONTAINER KONTEN -->
            <div class="content-container d-flex flex-column justify-content-start h-100 text-center" id="mainContainer">
                
                <!-- Section Atas -->
                <div class="top-content">
                    <p class="text-subtitle mb-0">The Wedding Of :</p>
                </div>

                <!-- Section Tengah -->
                <div class="middle-content">
                    <h1 class="couple-name">Stephen & Dessy</h1>
                    
                    <div class="guest-section">
                        <p class="guest-label mb-1">Kepada Yth.Bpk/Ibu/Saudara/i</p>
                        <h3 id="guestName" class="guest-name mb-1">Nama Tamu</h3>
                        <p class="guest-sub mb-0">di Tempat</p>
                    </div>
                </div>

                <!-- Section Bawah (Tombol Open Invitation) -->
                <div class="bottom-content">
                    <a href="main.html" id="btnOpenInvitation" class="btn btn-canva-brown rounded-pill">
                        Open Invitation
                    </a>
                </div>

            </div>

        </div>

    </div>

    <!-- Custom JS -->
    <script src="js/index.js"></script>
</body>
</html>
