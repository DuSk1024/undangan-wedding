<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan - Stephen & Dessy </title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Custom CSS Khusus Home -->
    <link rel="stylesheet" href="css/home.css">

    <!-- GSAP Animation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

    <div id="pageWrapper" class="cover-wrapper d-flex align-items-center justify-content-center text-center">
        <!-- Layer Background Krem Polos -->
        <div class="cover-bg-plain" id="bgPlain"></div>
        
        <!-- PENGUNCI LEBAR STAGE (Maksimal 500px) -->
        <div class="frame-stage">
            <!-- 6 Layer Potongan Ornamen -->
            <img src="images/top-left.png" class="frame-part" id="topLeft" alt="Kiri Atas">
            <img src="images/top-right.png" class="frame-part" id="topRight" alt="Kanan Atas">
            <img src="images/bottom-right.png" class="frame-part" id="bottomRight" alt="Kanan Bawah">
            <img src="images/bottom-left.png" class="frame-part" id="bottomLeft" alt="Kiri Bawah">
            
            <img src="images/top-center.png" class="frame-part" id="topCenter" alt="Tengah Atas">
            <img src="images/bottom-center.png" class="frame-part" id="bottomCenter" alt="Tengah Bawah">
        </div>

        <!-- Konten Teks Tengah -->
        <div class="container position-relative z-2 p-4" id="mainContainer">
            <p class="text-uppercase tracking-wide mb-2 text-gold fw-semibold">The Wedding Of</p>
            <h1 class="display-1 font-serif my-3 text-dark">Romeo & Juliet</h1>
            <p class="mb-4 fw-medium text-secondary">12 Desember 2026</p>

            <div class="guest-box my-4 p-4 mx-auto shadow-sm">
                <p class="small mb-1 text-uppercase text-muted">Kepada Yth. Bapak/Ibu/Saudara/i:</p>
                <h3 id="guestName" class="h4 fw-bold mb-0 text-dark">Tamu Undangan</h3>
            </div>

            <a href="index.html" id="btnOpenInvitation" class="btn btn-gold btn-lg rounded-pill px-4 py-2 mt-2 shadow">
                <i class="bi bi-envelope-open-fill me-2"></i>Buka Undangan
            </a>
        </div>
    </div>

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Custom JS Khusus Home -->
    <script src="js/home.js"></script>
</body>
</html>
